name: Patch vulnerable Next.js and lock dependencies
on:
  push:
    branches:
      - fix/vercel-next-security
    paths:
      - .github/workflows/refresh-next-lock.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Upgrade to patched Next.js 15 and refresh lockfile
        working-directory: frontend
        run: npm install --save-exact next@15.5.29 eslint-config-next@15.5.29 react@19.1.2 react-dom@19.1.2
      - name: Verify clean installation and build
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Commit updated package manifest and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package.json frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes"
          else
            git commit -m "fix(security): upgrade Next.js and React to patched versions"
            git push origin HEAD:fix/vercel-next-security
          fi
